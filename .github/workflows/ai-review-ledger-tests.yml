name: Test free Claude/Cue result collection

on:
  push:
    branches:
      - feature/ai-review-result-ledger-2026-11-11
    paths:
      - .github/workflows/ai-review-result-ledger.yml
      - .github/scripts/ai_review_result_ledger.py
      - tests/test_ai_review_result_ledger.py
      - .github/workflows/ai-review-ledger-tests.yml

permissions:
  contents: read

jobs:
  offline-ledger-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Syntax-check result ledger
        run: python3 -m py_compile .github/scripts/ai_review_result_ledger.py tests/test_ai_review_result_ledger.py
      - name: Verify no-charge GitHub result collection with mocked API
        run: python3 -m unittest discover -s tests -p 'test_ai_review_result_ledger.py' -v
