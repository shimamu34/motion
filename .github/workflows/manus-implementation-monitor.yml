name: Monitor approved Manus implementation tasks

on:
  workflow_dispatch:
  schedule:
    # GitHub scheduled execution is best-effort, not guaranteed every 30 min.
    - cron: "17,47 * * * *"

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: manus-implementation-monitor
  cancel-in-progress: false

jobs:
  monitor:
    # No Manus API calls until the owner has explicitly enabled the feature.
    if: vars.ENABLE_MANUS_IMPLEMENTATION == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Check existing Manus task states and annotate PRs without merging
        env:
          GH_TOKEN: ${{ github.token }}
          MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
          ENABLE_MANUS_IMPLEMENTATION: ${{ vars.ENABLE_MANUS_IMPLEMENTATION }}
        run: python3 .github/scripts/manus_implementation_monitor.py
