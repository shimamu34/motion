name: Test Manus implementation approval gate (offline)

on:
  pull_request:
    paths:
      - ".github/scripts/manus_implementation_dispatch.py"
      - ".github/workflows/manus-implementation-dispatch.yml"
      - ".github/workflows/manus-implementation-tests.yml"
      - "tests/test_manus_implementation_dispatch.py"

permissions:
  contents: read

jobs:
  safety-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python syntax check
        run: python3 -m py_compile .github/scripts/manus_implementation_dispatch.py tests/test_manus_implementation_dispatch.py
      - name: Offline owner-approval, branch, SHA, and duplicate tests
        run: python3 -m unittest discover -s tests -p 'test_manus_implementation_dispatch.py' -v
