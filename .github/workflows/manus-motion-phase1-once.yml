name: One-time approved Manus motion Phase-1 implementation

on:
  push:
    branches:
      - fix/motion-startup-resilience
    paths:
      - tasks/queue/20261111-motion-phase1.md

permissions:
  contents: write

concurrency:
  group: manus-motion-phase1-once
  cancel-in-progress: false

jobs:
  launch:
    if: github.repository == 'shimamu34/motion'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout approved implementation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Dispatch only exact DRAFT-to-READY transition and record result
        env:
          MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: python3 scripts/manus_phase1_once.py
