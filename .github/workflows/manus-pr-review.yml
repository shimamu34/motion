name: Manus AI PR Review (approval required)

# A PR being opened or updated MUST NOT spend Manus credits.
# The repository owner explicitly authorizes exactly one review of the
# current HEAD by commenting /manus-review on the PR Conversation page.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: manus-approved-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    # Do not accept PR content as executable workflow code. Only the repository
    # owner's exact comment on an actual PR can reach the Manus API.
    if: >-
      github.repository == 'shimamu34/motion' &&
      github.event.issue.pull_request != null &&
      github.event.comment.user.login == 'shimamu34' &&
      github.event.comment.body == '/manus-review'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout trusted workflow code from default branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Review current PR HEAD at most once, with bounded Manus prompt
        env:
          MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/manus_pr_review.py
